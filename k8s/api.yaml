# Heart-disease API: namespace, deployment, LoadBalancer service and ingress.
# Image name assumes a local build (`docker build -t heart-api:1.0.0 .`); for a
# cloud cluster push to a registry and change `image:`.
apiVersion: v1
kind: Namespace
metadata:
  name: heart-mlops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  namespace: heart-mlops
  labels: {app: heart-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: heart-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: heart-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: heart-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: LOG_LEVEL, value: INFO}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-mlops
  labels: {app: heart-api}
spec:
  # Docker Desktop maps LoadBalancer to localhost; on Minikube run `minikube tunnel`.
  type: LoadBalancer
  selector: {app: heart-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-api
  namespace: heart-mlops
spec:
  ingressClassName: nginx
  rules:
    - host: heart-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-api
                port: {number: 80}
